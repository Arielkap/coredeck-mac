<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — CoreDeck Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#07090e] text-slate-100 min-h-screen flex items-center justify-center p-6 selection:bg-cyan-500 selection:text-black">
  <div class="max-w-md w-full bg-[#0d111a] border border-slate-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden text-center">
    <!-- Glow -->
    <div class="absolute -top-20 left-1/2 -translate-x-1/2 w-48 h-48 bg-green-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative w-20 h-20 mx-auto mb-6">
      <img src="app-icon.png" alt="CoreDeck App Icon" class="w-20 h-20 rounded-2xl shadow-2xl border border-slate-700/60 object-contain">
      <div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-green-500 text-black flex items-center justify-center text-xs font-black shadow-lg">
        ✓
      </div>
    </div>

    <h1 class="text-2xl font-extrabold text-white">Payment Successful!</h1>
    <p class="text-sm text-slate-400 mt-2">Welcome to CoreDeck Pro Lifetime.</p>

    <div class="mt-6 p-4 rounded-xl bg-slate-900 border border-slate-800">
      <div class="text-[10px] mono text-slate-400 uppercase font-bold tracking-wider">Your Lifetime License Key</div>
      <div id="licenseKey" class="mono text-lg font-bold text-yellow-400 mt-2 select-all tracking-wider">
        CORE-PRO-XXXX-XXXX
      </div>
      <button onclick="copyKey()" id="copyBtn" class="mt-3 w-full py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs mono font-bold text-slate-200 border border-slate-700 transition-all flex items-center justify-center gap-1.5 cursor-pointer">
        Copy License Key
      </button>
    </div>

    <div class="mt-6 text-left p-4 rounded-xl bg-slate-900/50 border border-slate-800/80 text-xs text-slate-300 space-y-2 mono">
      <div class="font-bold text-white mb-1">Quick Activation:</div>
      <div>1. Download & open <strong class="text-cyan-400">CoreDeck.app</strong></div>
      <div>2. In the HUD header, click <strong class="text-yellow-400">UPGRADE</strong></div>
      <div>3. Paste your key and click <strong class="text-yellow-400">Activate</strong></div>
    </div>

    <a href="CoreDeck-Installer.dmg" download class="mt-6 block w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-extrabold text-sm shadow-xl shadow-cyan-500/20 transition-all">
      Download CoreDeck DMG (2.9 MB)
    </a>

    <div class="mt-4 text-[11px] text-slate-500 mono">
      Need help? Contact <a href="mailto:hello@armako.co.uk" class="text-cyan-400 hover:underline">hello@armako.co.uk</a>
    </div>
  </div>

  <script>
    function generateKey() {
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let part1 = '';
      let part2 = '';
      for (let i = 0; i < 4; i++) part1 += chars.charAt(Math.floor(Math.random() * chars.length));
      for (let i = 0; i < 4; i++) part2 += chars.charAt(Math.floor(Math.random() * chars.length));
      return `CORE-PRO-${part1}-${part2}`;
    }

    const key = generateKey();
    document.getElementById('licenseKey').innerText = key;

    function copyKey() {
      navigator.clipboard.writeText(key);
      const btn = document.getElementById('copyBtn');
      btn.innerText = 'Copied to Clipboard! ✓';
      setTimeout(() => { btn.innerText = 'Copy License Key'; }, 2000);
    }
  </script>
</body>
</html>
